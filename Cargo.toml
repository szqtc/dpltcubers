[package]
name = "dpltcubers"
version = "0.2.3"
edition = "2021"

[dependencies]
getopts = "0.2.23"
whoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4.2.4"
ndarray = "0.16.1"
fitsio = "0.21.9"
fitsio-sys = "0.5.7"
cdshealpix = "0.7.3"
num_cpus = "1.17.0"
itertools = "0.14.0"
indicatif = "0.18.0"

[profile.release]
codegen-units = 1
panic = "abort"

[[bin]]
name = "dpltcubers"
path = "src/main.rs"

[lib]
name = "dpltcubers"
path = "src/lib.rs"
crate-type = ["rlib"]