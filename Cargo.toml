[package]
name = "dpltcubers"
version = "0.2.5"
edition = "2024"

[dependencies]
getopts = "0.2.23"
whoami = "1.6.0"
chrono = "0.4.44"
hifitime = "4.3.2"
ndarray = "0.16.1"
fitsio = {version = "0.21.9", features = ["fitsio-src"]}
fitsio-sys = {version = "0.5.7", features = ["fitsio-src"]}
cdshealpix = "0.9.1"
num_cpus = "1.17.0"
itertools = "0.14.0"
indicatif = "0.18.0"

[profile.release]
codegen-units = 1
panic = "abort"

[[bin]]
name = "dpltcubers"
path = "src/main.rs"

[lib]
name = "dpltcubers"
path = "src/lib.rs"
crate-type = ["rlib"]
