# PyO3 extension modules must not link libpython.  On Apple targets the Python
# symbols stay undefined and are resolved by the interpreter at import time.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
